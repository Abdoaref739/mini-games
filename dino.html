<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }
        #game{
            width: 650px;
            height: 300px;
            border: 1px solid white;
            margin-top: 100px;
            overflow: hidden;
        }
        #character{
            width: 20px;
            height: 50px;
            top: 240px;
            position: relative;
        }
        #character > img{
            width: 50px;
            height: auto;
        }
        .jump{
            animation: jump 3s linear;
            transition: 0.7s ease;
        }
        #block{
            width: 30px;
            height: 30px;
            top: 190px;
            left: 1200px;
            position: relative;
            animation: object-slide 2s infinite linear;
        }
        #cactus-img{
            width: 30px;
            height: auto;
        }
        @keyframes object-slide {
            0%{
                left: 800px;
            }
            100%{
                left: -60px;
            }
        }
        @keyframes jump {
            0%{
                top: 150px;
            }
            30%{
                top: 120px;
            }
            70%{
                top: 120px;
            }
            100%{
                top: 150px;
            }
        }
    </style>
</head>
<body>
    <div id="game">
        <div id="character">
            <img src="./Assets/Dino/DinoJump.png" id="character-img">
        </div>
        <div id="block">
            <img src="./Assets/Cactus/LargeCactus1.png" id="cactus-img">
        </div>
    </div>
    <script>
        let character = document.getElementById("character");
        let block = document.getElementById("block");
        let characterImg = document.getElementById("character-img");
        let cactusImg = document.getElementById("cactus-img");
        let imgOrder = 1;
        let cactusImgOrder = 0;

        function jump(){
            character.classList.add("jump");
            setTimeout(function(){
                character.classList.remove("jump");
            }, 500);
        }
        document.addEventListener("keydown", jump);


        //check hit
        let checkHit = setInterval(function(){
            let characterTop = parseInt(window.getComputedStyle(character).getPropertyValue("top"));
            let blockLeft = parseInt(window.getComputedStyle(block).getPropertyValue("left"));
            console.log(characterTop)
            if(blockLeft < 20 && blockLeft > 0 && characterTop >= 150){
                alert()
            }
        }, 10);

        let characterImageChange = setInterval(function(){

            if(imgOrder === 1){
                characterImg.src = "./Assets/Dino/DinoRun2.png";
                imgOrder = 2;
            }else if(imgOrder === 2){
                characterImg.src = "./Assets/Dino/DinoRun1.png";
                imgOrder = 1;
            }
        }, 100);

        let cactusImgChange = setInterval(function(){

            if(cactusImg === 0){
                cactusImg.src = "./Assets/Dino/DinoRun2.png";
                cactusImgOrder = 2;
            }else if(imgOrder === 2){
                characterImg.src = "./Assets/Dino/DinoRun1.png";
                imgOrder = 1;
            }
        }, 100);
    </script>
</body>
</html>
