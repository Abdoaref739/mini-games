<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }
        #game{
            width: 500px;
            height: 200px;
            border: 1px solid white;
        }
        #character{
            width: 20px;
            height: 50px;
            background-color: white;
            top: 150px;
            position: relative;
        }
        #character > img{
            width: 50px;
            height: auto;
        }
        .jump{
            animation: jump 1s linear;
        }
        #block{
            width: 30px;
            height: 30px;
            background-color: gray;
            top: 120px;
            left: 460px;
            position: relative;
            animation: object-slide 1s infinite linear;
        }
        @keyframes object-slide {
            0%{
                left: 460px;
            }
            100%{
                left: -40px;
            }
        }
        @keyframes jump {
            0%{
                top: 150px;
            }
            30%{
                top: 100px;
            }
            70%{
                top: 100px;
            }
            100%{
                top: 150px;
            }
        }
    </style>
</head>
<body>
    <div id="game">
        <div id="character">
            <img src="./Assets/Dino/DinoRun1.png" id="character-img">
        </div>
        <div id="block"></div>
    </div>
    <script>
        let character = document.getElementById("character");
        let block = document.getElementById("block");

        function jump(){
            character.classList.add("jump");
            setTimeout(function(){
                character.classList.remove("jump");
            }, 500);
        }
        document.addEventListener("keydown", jump);


        //check hit
        let checkHit = setInterval(function(){
            let characterTop = parseInt(window.getComputedStyle(character).getPropertyValue("top"));
            let blockLeft = parseInt(window.getComputedStyle(block).getPropertyValue("left"));

            if(blockLeft < 20 && blockLeft > 0 && characterTop >= 130){
                alert()
            }
        }, 10);

        let characterImageChange = setInterval(function(){
            let characterImg = document.getElementById("character-img");
            
            if(characterImg.src === "./Assets/Dino/DinoRun1.png"){
                characterImg.src = "./Assets/Dino/DinoRun2.png";
            }else{
                characterImg.src = "./Assets/Dino/DinoRun1.png";
            }
        }, 200);
    </script>
</body>
</html>
