    <script>


//inserting the images
function insertImages(){
    document.querySelectorAll(".box").forEach(image => {
        if(image.innerText.length !== 0){
            if(image.innerText == "Wpawn" || image.innerText == "Bpawn"){
                image.innerHTML = `<img class="all-img all-pown" src="${image.innerText}.png" alt="">`;
            }else{
                image.innerHTML = `<img class="all-img" src="${image.innerText}.png" alt="">`;
            }
        }
    });
}
insertImages();

//coloring
function coloring(){
    const color = document.querySelectorAll(".box");
    color.forEach(color =>{
        getId = color.id
        arr = Array.from(getId)
        arr.shift()
        aside = eval(arr.pop())
        aup = eval(arr.shift())
        a = aside + aup
        if(a % 2 === 0){
            color.style.background = "rgb(232 235 239)";
        }else if(a % 2 !== 0){
            color.style.background = "red";
        }
    })
}
coloring();
    </script>
